<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>문자열 분할</title>
</head>

<body>
    <h2>문자를 기준으로 분할 출력</h2>
    <hr>

    <script>
        let input = prompt("문자열 입력");


        let result = input.split("&");
        for (let i = 0; i < result.length; i++) {
            document.write(result[i] + "<br>");
        }

    </script>
</body>

</html>
