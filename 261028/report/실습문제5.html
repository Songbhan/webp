<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>z-index 스타일 프로퍼티</title>

    <style>
        div {
            position: absolute;
        }

        img {
            position: absolute;
        }
    </style>
</head>

<body>

    <h3>z-index 스타일 프로퍼티</h3>
    <hr>

    <div>
        
        <img src="spade2.png" width="100" height="140">

        <!-- 사진 주소 넣기: 스페이드 2 카드 -->
        <img src="spade3.png" width="100" height="140">

        <!-- 사진 주소 넣기: 스페이드 3 카드 -->
        <img src="spade7.png" width="100" height="140">

        <!-- 사진 주소 넣기: 스페이드 7 카드 -->
        <img src="spadeA.png" width="100" height="140">
    </div>

    <script>
        let images = document.getElementsByTagName("img");
        let z = 0;

        for (let i = 0; i < images.length; i++) {
            images[i].style.zIndex = i;
            images[i].style.left = "0px";
            images[i].style.top = "0px";

            images[i].onclick = function () {
                this.style.zIndex = --z;
            };
        }
    </script>

</body>

</html>
