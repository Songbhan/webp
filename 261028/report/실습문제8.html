<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>이미지 확대</title>

    <script>
        let scale = 1;

        function expand(obj) {
            scale++;

            if (scale > 4) {
                scale = 2;
            }

            obj.style.transform = "scale(" + scale + ",1)";
            obj.style.transformOrigin = "left center";
        }
    </script>
</head>

<body>
    <h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
    <hr>


    <img src="spongebob.png" width="150" onclick="expand(this)">

</body>

</html>
