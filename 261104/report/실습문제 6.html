<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마우스 휠을 이용한 이미지 확대/축소</title>
<style>body { font-family: sans-serif; } </style>
</head>
<body>
<h3>마우스 휠을 이용한 이미지 확대/축소</h3>
<hr>
<p>이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.</p>
<img id="flower" src="media/Tulips.png" alt="튤립" width="200" height="150">
<script>
const flower = document.getElementById('flower');
let imageWidth = 200;
flower.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.deltaY === 0) return;
    imageWidth *= e.deltaY < 0 ? 0.95 : 1.05;
    flower.style.width = imageWidth + 'px';
    flower.style.height = imageWidth * 3 / 4 + 'px';
}, { passive: false });
</script>
</body>
</html>
