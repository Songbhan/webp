<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포커스와 onblur,onfocus</title>
<style>body { font-family: sans-serif; } </style>
</head>
<body>
<h3>포커스와 onblur,onfocus</h3>
<hr>
<p>브라우저 바깥에 마우스를 클릭하면 window 객체에 blur 이벤트가 발생하고 다시 돌아오면 focus 이벤트가 발생한다.</p>
<script>
window.onblur = function () { document.body.style.backgroundColor = 'lightgray'; };
window.onfocus = function () { document.body.style.backgroundColor = 'white'; };
</script>
</body>
</html>
