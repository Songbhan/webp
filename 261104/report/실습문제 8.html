<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이템을 클릭하면 1.3배 크기로</title>
<style>body { font-family: sans-serif; } </style>
</head>
<body>
<h3>아이템을 클릭하면 1.3배 크기로</h3>
<hr>
<p>여름 방학 때 하고 싶은 것들</p>
<ul>
<li>자전거로 대한민국 일주</li>
<li>책 100권 읽기</li>
<li>철인 3종 경기 준비</li>
<li>자바스크립트 정복</li>
</ul>
<script>
let previous = null;
for (const item of document.getElementsByTagName('li')) {
    item.onclick = function (e) {
        if (previous) previous.style.fontSize = '1em';
        e.target.style.fontSize = '1.3em';
        previous = e.target;
    };
}
</script>
</body>
</html>
