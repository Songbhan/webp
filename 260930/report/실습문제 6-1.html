<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>animation</title>
    <style>
        @keyframes move {
            0% {transform: rotate(0deg);}
            100% {transform: rotate(360deg);}
        }
        #spongebob {
            animation-name: move;
            animation-duration: 1s;
            animation-iteration-count: infinite;
           
        }
    </style>
</head>
<body>
    <h2>어지러워요</h2>
    <hr>
    <div><img src="spongebob.png" id = "spongebob"></div>
</body>
</html>
