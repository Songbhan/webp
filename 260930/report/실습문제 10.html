<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>애니메이션</title>
    <style>
        @keyframes question {
            0% {
                margin-left: 100%;
            }

            100% {
                margin-left: 0%;
            }
        }

        p {
            animation-name: question;
            animation-duration: 3s;
        }
    </style>
</head>

<body>
    <h2>애니메이션 응용</h2>
    <hr>
    <p><img src="question.png" alt="q"> 질문 있습니다.</p>
</body>

</html>
