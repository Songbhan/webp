<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>소프트웨어 기술 선호에 관한 설문지</title>
    <link href="4.css" type="text/css" rel="stylesheet">
</head>

<body>

    <header>
        <h1>설문지</h1>

        <p>
            소프트웨어 기술에 대한 의견을 듣습니다.
            많은 참여 부탁드립니다.
        </p>

        <hr>
    </header>


    <section>

        <form>

            <p>
                <span>학년</span>
                <label>
                    <input type="radio" name="grade" value="1" checked>
                    1학년
                </label>

                <label>
                    <input type="radio" name="grade" value="2">
                    2학년
                </label>

                <label>
                    <input type="radio" name="grade" value="3">
                    3학년
                </label>

                <label>
                    <input type="radio" name="grade" value="4">
                    4학년
                </label>
            </p>


            <p>
                <span>성별</span>
                <label>
                    <input type="radio" name="gender" value="male" checked>
                    남
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    여
                </label>
            </p>


            <p>
                <span>관심분야</span>

                <select name="interest">
                    <option value="mobile">모바일 소프트웨어</option>
                    <option value="web">웹 서비스</option>
                </select>
            </p>


            <p>
                <span>진로(다중선택)</span>

                <label>
                    <input type="checkbox" name="career" value="development" checked>
                    개발
                </label>

                <label>
                    <input type="checkbox" name="career" value="planning">
                    기획
                </label>

                <label>
                    <input type="checkbox" name="career" value="sales">
                    영업
                </label>

                <label>
                    <input type="checkbox" name="career" value="startup">
                    창업
                </label>
            </p>


            <p>
                <span>남기고 싶은 말</span>
                <br>

                <textarea name="message" cols="50" rows="10" placeholder="글을 남겨주세요"></textarea>
            </p>
            </div>
        </form>

    </section>


    <footer>
        Copyright 2022 bu kitae
    </footer>

</body>

</html>
