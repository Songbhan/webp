<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>eval()로 수식계산</title>
</head>
<body>
    <h2>eval()로 수식계산</h2>
    <hr>
    <script>
        let a = prompt("수식 입력");
        let b = eval(a);
        document.write(a);
        document.write(" = ");
        document.write(b);
    </script>
</body>
</html>
