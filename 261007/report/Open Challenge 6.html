<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>별문자 출력하기</title>
</head>

<body>
    <h3>별문자 출력하기</h3>
    <hr>
    <script>
        let input = prompt("정수를 입력하세요.");
        let num = parseInt(input);
        if (isNaN(num)) {
            document.write("입력 오류입니다.");
        }
        else {
            for (let i = 0; i < num; i++) {
                for (let j = 0; j < i + 1; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }

        }
    </script>
</body>

</html>
