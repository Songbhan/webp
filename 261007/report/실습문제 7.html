<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>큰 자리수와 낮은자리수 같은지 비교</title>
</head>
<body>
    <h2>큰 자리수와 낮은자리수 같은지 비교</h2>
    <hr>
    <script>
        let num = prompt("숫자 입력");

        let low = num % 10;   
        let high = num;       

        while (high >= 10) {
           high = Math.floor(high / 10);
        }

     
        if (low == high) {
            document.write(num + ": 같음");
        } else {
            document.write(num + ": 다름");
        }
    </script>
</body>
</html>
