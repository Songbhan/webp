<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>do-while과 ...</title>
</head>
<body>
    <h2>암호를 입력하라!</h2>

    <hr>
    <script>
        let passwd;
        do{
            passwd = prompt("암호를 입력하라!");

        } while(passwd != "you"){
            document.write("통과!");
        };
   
        </script>  
</body>
</html>
