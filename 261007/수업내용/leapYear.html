<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>윤년 판단하기</title>
	<style>
		body {
			font-family: sans-serif;
			max-width: 480px;
			margin: 80px auto;
			padding: 24px;
			text-align: center;
		}

		input,
		button {
			padding: 10px;
			font-size: 1rem;
		}

		#result {
			min-height: 1.5em;
			margin-top: 20px;
		}
	</style>
</head>

<body>
	<h1>윤년 판단하기</h1>
	<label for="year">연도를 입력하세요:</label>
	<input type="number" id="year" min="1" step="1" placeholder="예: 2024">
	<button type="button" id="check">확인</button>
	<p id="result" aria-live="polite"></p>

	<script>
		const yearInput = document.getElementById("year");
		const result = document.getElementById("result");

		function checkLeapYear() {
			const year = Number(yearInput.value);

			if (!Number.isInteger(year) || year < 1) {
				result.textContent = "1 이상의 정수를 입력해 주세요.";
				return;
			}

			const isLeapYear = year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);
			result.textContent = `${year}년은 ${isLeapYear ? "윤년" : "평년"}입니다.`;
		}

		document.getElementById("check").addEventListener("click", checkLeapYear);
		yearInput.addEventListener("keydown", (event) => {
			if (event.key === "Enter") checkLeapYear();
		});
	</script>
</body>

</html>
