<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이템에 마우스를 올리면 설명 출력</title>
<style>body { font-family: sans-serif; } #description { position:absolute; visibility:hidden; width:230px; padding:6px; border:1px solid olive; background:lightyellow; pointer-events:none; }</style>
</head>
<body>
<h3>아이템에 마우스를 올리면 설명 출력</h3>
<hr>
<p>여름 방학 때 하고 싶은 것들</p>
<ul>
<li>자전거로 대한민국 일주</li>
<li>책 100권 읽기</li>
<li>철인 3종 경기 준비</li>
<li>자바스크립트 정복</li>
</ul>
<div id="description" role="tooltip"></div>
<script>
const descriptions = [
    '빨간자전거를 타고 서울, 대전, 대구, 부산 찍고, 목포, 인천을 거쳐 달린다.',
    '여러 분야의 책 100권을 읽고 독서 기록을 남긴다.',
    '수영, 자전거, 달리기를 연습하여 철인 3종 경기를 준비한다.',
    '자바스크립트의 문법과 DOM, 이벤트를 공부하고 웹 페이지를 만든다.'
];
const tooltip = document.getElementById('description');
function place(e) {
    tooltip.style.left = e.pageX + 12 + 'px';
    tooltip.style.top = e.pageY + 12 + 'px';
}
Array.from(document.getElementsByTagName('li')).forEach(function (item, index) {
    item.onmouseover = function (e) {
        tooltip.textContent = descriptions[index];
        place(e);
        tooltip.style.visibility = 'visible';
    };
    item.onmousemove = place;
    item.onmouseout = function () { tooltip.style.visibility = 'hidden'; };
});
</script>
</body>
</html>
