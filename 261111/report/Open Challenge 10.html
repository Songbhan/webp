<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>샤갈의 눈 내리는 마을</title>
    <style>
        body {
            max-width: 40rem;
        }

        body {
            margin: 0;
            max-width: none;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(#202345, #695476 68%, #a37c97);
        }

        main {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 12%;
            left: 19%;
            width: 8vmin;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #fff1cb;
            box-shadow: 0 0 5vmin #ffdb9f80;
        }

        .ground {
            position: absolute;
            inset: 72% -10% -25%;
            border-radius: 50% 50% 0 0;
            background: linear-gradient(#e4dff9, #969bc4);
        }

        .house {
            position: absolute;
            bottom: 22%;
            left: 53%;
            width: 26vmin;
            height: 16vmin;
            background: #654855;
        }

        .house::before {
            content: "";
            position: absolute;
            bottom: 95%;
            left: -12%;
            width: 124%;
            height: 15vmin;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            background: #e7e1fa;
        }

        .window {
            position: absolute;
            top: 28%;
            right: 18%;
            width: 5vmin;
            height: 5vmin;
            background: #ffd580;
            box-shadow: 0 0 2vmin #ffa94d;
        }

        .tree {
            position: absolute;
            bottom: 26%;
            width: 20vmin;
            height: 43vmin;
            clip-path: polygon(50% 0, 73% 31%, 62% 31%, 84% 56%, 71% 56%, 100% 85%, 56% 85%, 56% 100%, 44% 100%, 44% 85%, 0 85%, 29% 56%, 16% 56%, 38% 31%, 27% 31%);
            background: linear-gradient(#7881a4, #2c344d);
        }

        .tree-left {
            left: 11%;
        }

        .tree-right {
            right: 8%;
            height: 35vmin;
        }

        .snow {
            position: absolute;
            color: white;
            font: 24px sans-serif;
            pointer-events: none;
            text-shadow: 0 0 4px #65729d;
        }
    </style>
</head>

<body>
    <main aria-label="눈 내리는 마을">
        <div class="moon"></div>
        <div class="ground"></div>
        <div class="tree tree-left"></div>
        <div class="tree tree-right"></div>
        <div class="house">
            <div class="window"></div>
        </div>
    </main>
    <script>

        const flakes = [];
        for (let i = 0; i < 30; i++) {
            const element = document.createElement('div');
            element.className = 'snow';
            element.textContent = '*';
            element.setAttribute('aria-hidden', 'true');
            document.body.appendChild(element);
            flakes.push({
                element,
                x: Math.random() * 100,
                y: Math.random() * window.innerHeight,
                speed: 1 + Math.random() * 2
            });
        }

        function drawSnow() {
            for (const flake of flakes) {
                flake.element.style.left = flake.x + '%';
                flake.element.style.top = flake.y + 'px';
            }
        }

        drawSnow();
        setInterval(function () {
            for (const flake of flakes) {
                flake.y += flake.speed;
                if (flake.y >= window.innerHeight - 15) {
                    flake.y = -20;
                    flake.x = Math.random() * 100;
                }
            }
            drawSnow();
        }, 30);

    </script>
</body>

</html>
