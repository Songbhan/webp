<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산수 문제를 풀어 봅시다.</title>
<style>
body { max-width: 40rem; }
.row { margin: 0.35em 0; } .row label { display: inline-block; min-width: 4.5em; } .row input { width: 7em; } .wrong { text-decoration: line-through; } output { display:inline-block; min-width:2ch; }
</style>
</head>
<body>
<h3>산수 문제를 풀어 봅시다.</h3>
<div>수식을 계산하여 답을 입력하고 채점 버튼을 누르세요.</div><hr>
<p class="row"><label for="answer1" data-answer="30">5*6</label> <input type="text" inputmode="numeric" id="answer1" autocomplete="off"></p>
<p class="row"><label for="answer2" data-answer="22">7+5*3</label> <input type="text" inputmode="numeric" id="answer2" autocomplete="off"></p>
<p class="row"><label for="answer3" data-answer="46">23*2</label> <input type="text" inputmode="numeric" id="answer3" autocomplete="off"></p>
<p class="row"><label for="answer4" data-answer="28">35-7</label> <input type="text" inputmode="numeric" id="answer4" autocomplete="off"></p>
<button type="button" id="grade">채점</button> <output id="score" aria-label="맞은 개수">0</output>
<script>

const rows = Array.from(document.querySelectorAll('.row'));
const score = document.getElementById('score');

function grade() {
    let correct = 0;
    for (const row of rows) {
        const label = row.querySelector('label');
        const input = row.querySelector('input');
        const value = input.value.trim();
        const matches = /^[-+]?\d+$/.test(value) && Number(value) === Number(label.dataset.answer);
        label.classList.toggle('wrong', !matches);
        if (matches) correct++;
    }
    score.textContent = correct;
}
document.getElementById('grade').addEventListener('click', grade);

</script>
</body>
</html>
