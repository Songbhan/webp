<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML5</title>
<style>
body { max-width: 40rem; }

</style>
</head>
<body>
<h3>HTML5</h3><hr><p>HTML5를 학습하는 사이트입니다. 여기서 HTML5, CSS3, 자바스크립트를 배울 수 있습니다.</p>
<button type="button" id="retry" hidden>환영 창 열기</button>
<script>

const retry = document.getElementById('retry');

function openWelcome() {
    const popup = window.open('', 'welcome', 'popup,width=200,height=80,left=500,top=400');
    retry.hidden = Boolean(popup);
    if (!popup) return;

    popup.document.open();
    popup.document.write('<!doctype html><html lang="ko"><meta charset="utf-8"><body>접속 감사합니다!<br>열심히 하세요!</body></html>');
    popup.document.close();
    popup.document.title = '환영';
    popup.document.body.style.backgroundColor = 'yellowgreen';
}
window.addEventListener('load', openWelcome);
retry.addEventListener('click', openWelcome);

</script>
</body>
</html>
