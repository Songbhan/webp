<!DOCTYPE html>
<html>
<head>
    <!-- 문제 답: body -> head로 적어야함. -->
    <meta charset="utf-8">

    <title>오류를 찾으세요</title>

    <style>
        /* 문제 답:center뒤 ; 누락 */
        h3 {
            text-align: center;
            color: darkred;
        }

        span {
            color: blue;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <!--문제 답:</h>를 </h3>으로 변경 -->
    <h3>Elvis Presley</h3>

    He was an American singer and actor. In November 1956,
    he is often referred to as
    "<span>the King of Rock and Roll</span>".
</body>
</html>
